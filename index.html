<html lang="ht">
<head>

<style>
:root{
  --bg:#f4f2ee;--card:#fff;--text:#16141a;--muted:#6b6672;--line:#e7e2da;--chip:#f1ece3;
  --ink:#17131f;--ink-2:#2b2140;--gold:#f2c14e;
  --accent:#c8941a;--accent-ink:#1a1306;--head:#8a5d00;
  --danger:#b42318;--danger-bg:#fdecea;--warn:#9a5b00;--warn-bg:#fdf1dc;--ok:#11643a;--ok-bg:#e4f4ea;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0b12;--card:#17141f;--text:#f2eee6;--muted:#a39cad;--line:#2a2535;--chip:#241f2e;
  --ink:#08060c;--ink-2:#221a33;
  --accent:#e6b23a;--accent-ink:#1a1306;--head:#e6b23a;
  --danger:#ff8a7a;--danger-bg:#3b1c1a;--warn:#f2c14e;--warn-bg:#3a2b10;--ok:#5fd398;--ok-bg:#12301f;
}}
:root[data-theme="dark"]{
  --bg:#0d0b12;--card:#17141f;--text:#f2eee6;--muted:#a39cad;--line:#2a2535;--chip:#241f2e;
  --ink:#08060c;--ink-2:#221a33;
  --accent:#e6b23a;--accent-ink:#1a1306;--head:#e6b23a;
  --danger:#ff8a7a;--danger-bg:#3b1c1a;--warn:#f2c14e;--warn-bg:#3a2b10;--ok:#5fd398;--ok-bg:#12301f;
}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.demo{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:6px 16px;text-align:center}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:19px;margin:0;flex:1;color:var(--gold);font-weight:800;letter-spacing:.02em}
.who{font-size:12px;color:#c9c3d3;text-align:right;line-height:1.25}
.who b{color:#fff;font-weight:600}
header .btn{background:transparent;border-color:#3a3346;color:#fff}
main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:180px;padding:8px 4px 10px;background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.hero{background:linear-gradient(135deg,#1d1828 0%,#2b2140 55%,#4a3512 100%);padding:14px;border-radius:20px;box-shadow:0 10px 24px rgba(23,19,31,.22)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.hero .stat{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.09);color:#fff}
.hero .stat span{color:#c9c3d3}
.stat b{display:block;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:13px}
.stat.late b{color:#ff8a7a} .stat.soon b{color:var(--gold)}
.stat.profit b{color:var(--ok)} .stat.loss b{color:var(--danger)}
.hero .stat.profit b{color:#7ee2ac}
h2{font-size:12.5px;margin:22px 0 8px;color:var(--head);text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row.alert-late{border-color:var(--danger)} .row.alert-soon{border-color:var(--accent)}
.row .info{flex:1;min-width:0}
.row .info.tap{cursor:pointer}
.row .t{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s.wrap{white-space:normal}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.late{background:var(--danger-bg);color:var(--danger)}
.badge.soon{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.gold{background:var(--ink);color:var(--gold)}
.actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(200,148,26,.3)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.block{width:100%;padding:12px}
.btn.icon{padding:7px;width:36px;height:36px}
.btn.icon svg,.btn svg{width:19px;height:19px;flex-shrink:0}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.search{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 12px;padding-bottom:2px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--gold);border-color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--danger)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel + .panel{margin-top:10px}
.panel h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .grow{flex:1}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.kv > span:first-child{color:var(--muted)}
.kv > span:last-child{text-align:right;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.back{background:none;border:0;color:var(--head);padding:0 0 10px;font-size:15px;cursor:pointer;font-weight:700}
.dtitle{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.dtitle h2{margin:0;font-size:22px;color:var(--text);text-transform:none;letter-spacing:-.01em;flex:1}
.pw-row{display:flex;align-items:center;gap:6px}
.pw{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.06em;background:var(--chip);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;min-width:0}
.pending{background:var(--warn-bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pending ol{margin:0;padding-left:20px;font-size:14px}
.pending .t{color:var(--warn);font-weight:700}
.big{font-size:22px;font-weight:700}
.alert{border-radius:12px;padding:8px 10px;font-size:14px}
.alert.late{background:var(--danger-bg);color:var(--danger)}
.alert.soon{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.wallet{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ledger{font-size:13px;display:flex;flex-direction:column;gap:4px}
.ledger div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.ledger b{color:var(--text);font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(8,6,12,.6)}
form.f{padding:18px;display:flex;flex-direction:column;gap:12px}
form.f h3{margin:0 0 2px;font-size:18px}
form.f .sub{margin:-8px 0 0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:15px}
input,select,textarea{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
input[type=checkbox]{width:20px;height:20px}
input.pin{font-size:26px;letter-spacing:.5em;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.money-in{display:grid;grid-template-columns:1fr 96px;gap:8px}
.fbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.fbtns .spacer{flex:1}
.note{background:var(--chip);border-radius:12px;padding:10px;font-size:14px}
.msg{background:#e7f6dd;color:#16261a;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;white-space:pre-wrap;line-height:1.4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg{background:#1f3a2a;color:#e6f4ea}}
:root[data-theme="dark"] .msg{background:#1f3a2a;color:#e6f4ea}
.err{color:var(--danger);font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.login{max-width:400px;margin:0 auto;padding:0 16px 40px}
.login .brand{background:linear-gradient(135deg,#1d1828 0%,#2b2140 55%,#4a3512 100%);border-radius:0 0 28px 28px;margin:0 -16px 20px;padding:56px 24px 34px;text-align:center;color:#fff}
.login .brand h1{margin:0;color:var(--gold);font-size:34px;font-weight:800;letter-spacing:.02em}
.login .brand p{margin:6px 0 0;color:#c9c3d3}
.login .card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin:16px 16px 0}
.seg button{border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money3 .stat b{font-size:16px}
.ratebar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.ratebar span{flex:1}
.mrow{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.mrow label{flex:1;min-width:140px}
.amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--danger)} .amt.in{color:var(--ok)}
table.avg{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
table.avg th,table.avg td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.avg th:first-child,table.avg td:first-child{text-align:left}
table.avg thead th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
table.avg tfoot td{font-weight:700;border-bottom:0}
table.avg tfoot tr:first-child td{border-top:2px solid var(--line)}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.tablewrap{overflow-x:auto}
.loading{color:var(--muted);text-align:center;padding:40px}
.pinbox{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:10px 12px}
.pinbox .pv{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.35em}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--warn)}
.lock svg{width:14px;height:14px}
.receipt{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.receipt .ok-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.receipt .amtbig{font-size:28px;font-weight:800}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.member{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.member .info{flex:1;min-width:0}
.member select{width:auto;padding:6px 8px;font-size:14px}
</style>

<script type="module">
// =====================================================================
//  Konfigirasyon
// =====================================================================
const C = Object.assign({
  SUPABASE_URL: '', SUPABASE_ANON_KEY: '', BUSINESS_NAME: 'Gold Film', DEFAULT_CURRENCY: 'HTG', DEFAULT_PRICE: 0,
  COUNTRY_CODE: '509', DUE_SOON_DAYS: 3, CARD_ALERT_DAYS: 7, SERVICE_NAME: 'Netflix',
}, window.APP_CONFIG || {});
const DEMO = !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY;
const SOON = Number(C.DUE_SOON_DAYS) || 3;
const CARD_DAYS = Number(C.CARD_ALERT_DAYS) || 7;
const MAX_OWNERS = 3, MAX_ASSOCS = 3;

// =====================================================================
//  Lang (HT / FR)
// =====================================================================
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* pa grav */ } },
};
let LANG = store.get('gf-lang') === 'fr' ? 'fr' : 'ht';
const t = (ht, fr) => (LANG === 'fr' ? fr : ht);
const tl = (lang, ht, fr) => (lang === 'fr' ? fr : ht);
document.documentElement.lang = LANG;
let THEME = ['light', 'dark'].includes(store.get('gf-theme')) ? store.get('gf-theme') : 'auto';
function applyTheme() {
  if (THEME === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = THEME;
}
applyTheme();

// =====================================================================
//  Ti zouti
// =====================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MO = { ht: ['jan', 'fev', 'mas', 'avr', 'me', 'jen', 'jiy', 'out', 'sep', 'okt', 'nov', 'des'], fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'] };
const MO_LONG = { ht: ['Janvye', 'Fevriye', 'Mas', 'Avril', 'Me', 'Jen', 'Jiyè', 'Out', 'Septanm', 'Oktòb', 'Novanm', 'Desanm'], fr: ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'] };
const pad = (n) => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const daysUntil = (s) => Math.round((parseD(s) - parseD(todayStr())) / 86400000);
const fmtDateL = (s, lang) => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return `${d} ${MO[lang][m - 1]} ${y}`; };
const fmtDate = (s) => fmtDateL(s, LANG);
const fmtMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return `${MO_LONG[LANG][m - 1]} ${y}`; };
const isoDay = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = (s, n) => { const x = new Date(parseD(s) + n * 86400000); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}`; };
const addMonths = (s, n) => {
  const [y, m, d] = s.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  return `${first.getUTCFullYear()}-${pad(first.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
};
const addMonthsYM = (ym, n) => addMonths(`${ym}-01`, n).slice(0, 7);
const monthEnd = (ym) => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`; };
const dueAfterPayment = (due, months) => { let n = addMonths(due, months); if (n <= todayStr()) n = addMonths(todayStr(), months); return n; };
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const usdF = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const htgF = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const fmt = (n, cur) => cur === 'USD' ? `${Number(n) < 0 ? '−' : ''}$${usdF.format(Math.abs(Number(n) || 0))}` : `${htgF.format(Number(n) || 0)} HTG`;
const conv = (amount, from, rate, to) => {
  amount = Number(amount) || 0; rate = Number(rate) || 1;
  if (from === to) return amount;
  return from === 'USD' ? amount * rate : amount / rate;
};
const curOpts = (sel) => ['HTG', 'USD'].map((c) => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
const isOwner = () => !!S.me && S.me.role === 'owner';
const isPrincipal = () => !!S.me && !!S.me.principal;
const monthsWord = (n, lang) => tl(lang, `${n} mwa`, `${n} mois`);

const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
  clients: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg>',

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
  }
  toast(t('Kopye.', 'Copié.'));
}
function generatePassword() {
  const U = 'ABCDEFGHJKMNPQRSTUVWXYZ', L = 'abcdefghjkmnpqrstuvwxyz', D = '23456789', A = U + L + D;
  const rnd = (n) => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };
  for (;;) {
    let s = '';
    for (let i = 0; i < 12; i++) s += A[rnd(A.length)];
    if (/[A-Z]/.test(s) && /[a-z]/.test(s) && /[0-9]/.test(s)) return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
  }
}

//  Done: Supabase (baz done a ap mete ajou apre konfimasyon ekran yo)
// =====================================================================
function supabaseApi(sb) {
  const q = async (p) => { const { data, error } = await p; if (error) throw new Error(error.message); return data; };
  const rpc = (fn, args) => q(sb.rpc(fn, args));
  const strip = (o) => { const c = { ...o }; delete c.id; delete c.created_at; return c; };
  const save = (table, o) => o.id ? q(sb.from(table).update(strip(o)).eq('id', o.id)) : q(sb.from(table).insert(strip(o)));
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async signIn(email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message.includes('Invalid') ? t('Imèl oswa modpas pa bon.', 'E-mail ou mot de passe incorrect.') : error.message);
    },
    async signUp(name, email, password) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
      if (error) throw new Error(error.message);
      return !!data.session;
    },
    async requestAccess() {
      const { data: { user } } = await sb.auth.getUser();
      return rpc('request_access', { p_name: (user && user.user_metadata && user.user_metadata.name) || '' });
    },
    async signOut() { await sb.auth.signOut(); },
    async me() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return null;
      const rows = await q(sb.from('app_users').select('*').eq('id', user.id));
      return rows[0] || { id: user.id, role: 'none', name: (user.user_metadata || {}).name || '', email: user.email };
    },
    async loadAll(owner) {
      const [settings, users, accounts, extras, clients, passwords, ledger] = await Promise.all([
        q(sb.from('settings').select('*').eq('id', 1)),
        q(sb.from('app_users').select('*')),
        q(sb.from('accounts').select('*').order('label')),
        q(sb.from('extra_slots').select('*').order('id')),
        q(sb.from('clients').select('*').order('name')),
        q(sb.from('account_passwords').select('*').order('id')),
        owner ? q(sb.from('card_ledger').select('*').order('entry_date').order('id')) : Promise.resolve([]),
      ]);
      return { settings: settings[0], users, accounts, extras, clients, passwords, ledger };
    },
    processBilling: () => rpc('process_billing'),
    saveAccount: (a) => save('accounts', a),
    deleteAccount: (id) => q(sb.from('accounts').delete().eq('id', id)),
    saveExtra: (x) => save('extra_slots', x),
    saveClient: (c) => save('clients', c),
    deleteClient: (id) => q(sb.from('clients').delete().eq('id', id)),
    recordPayment: (id, amount, currency, months) => rpc('record_payment', { p_client_id: id, p_amount: amount, p_currency: currency, p_months: months }),
    setPin: (id, pin) => rpc('set_client_pin', { p_client_id: id, p_pin: pin }),
    addCard: (aid, xid, usd, paid, cur, date) => rpc('add_card', { p_account_id: aid, p_extra_id: xid, p_amount_usd: usd, p_paid_amount: paid, p_paid_currency: cur, p_date: date }),
    adjustBalance: (aid, xid, bal) => rpc('adjust_balance', { p_account_id: aid, p_extra_id: xid, p_new_balance: bal }),
    setRate: (rate) => rpc('set_rate', { p_rate: rate }),
    proposePassword: (aid, pw) => rpc('propose_password', { p_account_id: aid, p_password: pw }),
    confirmPassword: (aid) => rpc('confirm_password', { p_account_id: aid }),
    cancelPassword: (aid) => rpc('cancel_password', { p_account_id: aid }),
    setMemberRole: (uid, role) => rpc('set_member_role', { p_user_id: uid, p_role: role }),
    listPayments: (from, to) => q(sb.from('payments').select('*').gte('paid_on', from).lte('paid_on', to).order('paid_on', { ascending: false }).order('id', { ascending: false })),
  };
}

    async saveClient(c) { const p = { ...c }; delete p.pin; delete p.pin_set_at; delete p.pin_set_by; upsert('clients', p, checkClient); },
    async deleteClient(id) {
      ownerOnly();
      db.clients = db.clients.filter((c) => c.id !== id);
      db.payments.forEach((p) => { if (p.client_id === id) p.client_id = null; });
      save();
    },
    async recordPayment(id, amount, currency, months) {
      need(months >= 1 && months <= 12 && amount >= 0, t('Done yo pa valid', 'Données invalides'));
      const c = db.clients.find((x) => x.id === id);
      c.next_due = dueAfterPayment(c.next_due, months);
      if (c.status !== 'left') c.status = 'active';
      db.payments.push({ id: nid(), client_id: id, client_name: c.name, amount, currency, rate: db.settings.usd_rate, months, paid_on: todayStr(), recorded_by: db.as });
      save();
      return c.next_due;
    },
    async setPin(id, pin) {
      need(/^\d{4}$/.test(pin), t('PIN nan dwe gen 4 chif', 'Le PIN doit avoir 4 chiffres'));
      const c = db.clients.find((x) => x.id === id);
      if (c.pin_set_at) {
        const until = new Date(c.pin_set_at).getTime() + db.settings.pin_lock_days * 86400000;
        need(Date.now() >= until, t(`PIN nan bloke jiska ${fmtDate(isoDay(until))}`, `PIN bloqué jusqu’au ${fmtDate(isoDay(until))}`));
      }
      Object.assign(c, { pin, pin_set_at: nowIso(), pin_set_by: db.as });
      save();
    },
    async addCard(aid, xid, usd, paid, cur, date) {
      ownerOnly();
      db.ledger.push({ id: nid(), account_id: aid, extra_id: xid || null, kind: 'card', amount_usd: usd, paid_amount: paid || 0, paid_currency: cur || 'HTG', paid_rate: db.settings.usd_rate, entry_date: date || todayStr() });
      save();
    },
    async adjustBalance(aid, xid, bal) {
      ownerOnly();
      const diff = r2(bal - balDb(aid, xid || null));
      if (diff !== 0) db.ledger.push({ id: nid(), account_id: aid, extra_id: xid || null, kind: 'adjust', amount_usd: diff, entry_date: todayStr() });
      save();
    },
    async setRate(rate) { ownerOnly(); db.settings = { ...db.settings, usd_rate: rate, updated_at: nowIso(), updated_by: db.as }; save(); },
    async proposePassword(aid, pw) {
      db.passwords = db.passwords.filter((p) => !(p.account_id === aid && p.status === 'pending'));
      db.passwords.push({ id: nid(), account_id: aid, password: pw, status: 'pending', created_at: nowIso(), created_by: db.as, confirmed_at: null, confirmed_by: null });
      save();
    },
    async confirmPassword(aid) {
      const p = db.passwords.find((x) => x.account_id === aid && x.status === 'pending');
      db.passwords.forEach((x) => { if (x.account_id === aid && x.status === 'active') x.status = 'old'; });
      Object.assign(p, { status: 'active', confirmed_at: nowIso(), confirmed_by: db.as });
      const olds = db.passwords.filter((x) => x.account_id === aid && x.status === 'old').sort((a, b) => String(b.confirmed_at).localeCompare(String(a.confirmed_at)));
      const drop = new Set(olds.slice(2).map((x) => x.id));
      db.passwords = db.passwords.filter((x) => !drop.has(x.id));
      save();
    },
    async cancelPassword(aid) { db.passwords = db.passwords.filter((p) => !(p.account_id === aid && p.status === 'pending')); save(); },
    async setMemberRole(uid, newRole) {
      need(me().principal, t('Se pwopriyetè prensipal la sèlman ki jere ekip la', 'Seul le propriétaire principal gère l’équipe'));
      const u = db.users.find((x) => x.id === uid);
      need(u && !u.principal, t('Ou pa ka chanje wòl pwopriyetè prensipal la', 'Impossible de modifier le propriétaire principal'));
      if (newRole === 'remove') { db.users = db.users.filter((x) => x.id !== uid); save(); return; }
      const others = db.users.filter((x) => x.role === newRole && x.id !== uid);
      need(others.length < (newRole === 'owner' ? MAX_OWNERS : MAX_ASSOCS), newRole === 'owner' ? t('Deja gen 3 pwopriyetè', 'Il y a déjà 3 propriétaires') : t('Deja gen 3 asosye', 'Il y a déjà 3 associés'));
      const prefix = newRole === 'owner' ? 'P' : 'A';
      const used = new Set(others.map((x) => x.code));
      let n = 1; while (used.has(prefix + n)) n++;
      Object.assign(u, { role: newRole, code: prefix + n });
      save();
    },
    async listPayments(from, to) {
      ownerOnly();
      return clone(db.payments.filter((p) => p.paid_on >= from && p.paid_on <= to)).sort((a, b) => b.paid_on.localeCompare(a.paid_on) || b.id - a.id);
    },
  };
}

const balanceOf = (aid, xid) => r2(S.ledger.filter((l) => l.account_id === aid && (l.extra_id ?? null) === (xid ?? null)).reduce((s, l) => s + Number(l.amount_usd), 0));
const pwOf = (aid, status) => S.passwords.filter((p) => p.account_id === aid && p.status === status);

const lockDays = () => Number(S.settings.pin_lock_days ?? 3);
const pinUnlockMs = (c) => (c.pin_set_at ? new Date(c.pin_set_at).getTime() + lockDays() * 86400000 : 0);
const pinLocked = (c) => Date.now() < pinUnlockMs(c);

function wallet(a, x) {
  const cost = x ? Number(x.price_usd) : accountCost(a);
  const balance = balanceOf(a.id, x ? x.id : null);
  const next = x ? x.next_billing : a.next_billing;
  const w = { a, x, cost, balance, next, label: x ? `${a.label} · ${x.label}` : a.label };
  if (!(cost > 0) || !next) return { ...w, until: null, alert: null };
  const k = Math.floor((balance + 1e-9) / cost);
  const until = addMonths(next, k);
  const short = r2(cost - (balance - k * cost));
  const d = daysUntil(next);
  let alert = null;
  if (d <= 0 && balance < cost) alert = { k: 'late', text: t(`Pa peye! Netflix te dwe retire kòb ${fmtDate(next)}. Manke ${fmt(short, 'USD')}.`, `Impayé ! Netflix devait prélever le ${fmtDate(next)}. Il manque ${fmt(short, 'USD')}.`) };
  else if (balance < cost && d <= CARD_DAYS) alert = { k: 'soon', text: t(`Manke ${fmt(short, 'USD')} anvan ${fmtDate(next)}.`, `Il manque ${fmt(short, 'USD')} avant le ${fmtDate(next)}.`) };
  return { ...w, k, until, short, alert };
}
function allWallets() {
  const out = [];
  S.accounts.filter((a) => a.active).forEach((a) => {
    out.push(wallet(a, null));
    activeExtras(a.id).filter((x) => x.billing === 'own').forEach((x) => out.push(wallet(a, x)));
  });
  return out;
}

function clientState(c) {
  if (c.status === 'left') return { k: '', label: t('Kite', 'Parti') };
  if (c.status === 'paused') return { k: 'late', label: t('An poz', 'En pause') };
  const d = daysUntil(c.next_due);
  if (d < 0) return { k: 'late', label: t(`An reta ${-d} j`, `${-d} j de retard`) };
  if (d === 0) return { k: 'soon', label: t('Jodi a', "Aujourd'hui") };
  if (d <= SOON) return { k: 'soon', label: t(`Nan ${d} j`, `Dans ${d} j`) };
  return { k: 'ok', label: t('A jou', 'À jour') };
}

const payIn = (p, cur) => conv(p.amount, p.currency, p.rate, cur);
const cardOut = (l, cur) => conv(l.paid_amount, l.paid_currency || 'HTG', l.paid_rate, cur);
const cardsBetween = (from, to) => S.ledger.filter((l) => l.kind === 'card' && l.entry_date >= from && l.entry_date <= to);

async function loadMoney() {
  const M = S.money, cur = M.cur, box = $('#mbody');
  if (!box) return;
  try {
    if (M.mode === 'month') {
      const from = `${M.month}-01`, to = monthEnd(M.month);
      const pays = await api.listPayments(from, to);
      if (!$('#mbody')) return;
      const cards = cardsBetween(from, to).slice().reverse();
      const inn = pays.reduce((s, p) => s + payIn(p, cur), 0);
      const out = cards.reduce((s, l) => s + cardOut(l, cur), 0);
      const expIn = S.clients.filter((c) => c.status === 'active').reduce((s, c) => s + conv(c.price, c.currency, rate(), cur), 0);
      const expOut = allWallets().reduce((s, w) => s + conv(w.cost, 'USD', rate(), cur), 0);
      $('#mbody').innerHTML = `
        <div class="hero"><div class="money3">
          ${stat(fmt(inn, cur), t('Antre', 'Entrées'))}${stat(fmt(out, cur), t('Kat kado', 'Cartes'))}${stat(fmt(inn - out, cur), t('Benefis', 'Bénéfice'), inn - out >= 0 ? 'profit' : 'loss')}
        </div></div>
        <div class="note" style="margin-top:10px">${t('Chak mwa, ak to jodi a', 'Chaque mois, au taux du jour')}: <b>${fmt(expIn, cur)}</b> ${t('antre si tout moun peye', 'si tous paient')} · <b>${fmt(expOut, cur)}</b> ${t('pou kont yo', 'pour les comptes')} · ${t('benefis prevwa', 'bénéfice prévu')} <b>${fmt(expIn - expOut, cur)}</b>.</div>
        <h2>${t('Peman kliyan', 'Paiements clients')} (${pays.length})</h2>
        ${listOr(pays, (p) => `<div class="row"><div class="info"><div class="t">${esc(p.client_name || '')}</div><div class="s">${fmtDate(p.paid_on)} · ${monthsWord(p.months, LANG)} · ${esc(who(p.recorded_by))}${p.currency !== cur ? ` · ${fmt(p.amount, p.currency)}` : ''}</div></div><span class="amt in">+${fmt(payIn(p, cur), cur)}</span></div>`, t('Pa gen peman.', 'Aucun paiement.'))}
        <h2>${t('Kat kado achte', 'Cartes achetées')} (${cards.length})</h2>
        ${listOr(cards, (l) => { const a = acc(l.account_id); const x = l.extra_id ? ext(l.extra_id) : null; return `<div class="row"><div class="info"><div class="t">${esc(a ? a.label : '—')}${x ? ` · ${esc(x.label)}` : ''}</div><div class="s">${fmtDate(l.entry_date)} · ${t('kat', 'carte')} ${fmt(l.amount_usd, 'USD')}</div></div><span class="amt out">−${fmt(cardOut(l, cur), cur)}</span></div>`; }, t('Pa gen kat.', 'Aucune carte.'))}`;
    } else {
      const first = addMonthsYM(M.end, -(M.count - 1));
      const pays = await api.listPayments(`${first}-01`, monthEnd(M.end));
      if (!$('#mbody')) return;
      const rows = [];
      for (let i = 0; i < M.count; i++) {
        const ym = addMonthsYM(first, i);
        const inn = pays.filter((p) => p.paid_on.slice(0, 7) === ym).reduce((s, p) => s + payIn(p, cur), 0);
        const out = cardsBetween(`${ym}-01`, monthEnd(ym)).reduce((s, l) => s + cardOut(l, cur), 0);
        rows.push({ ym, inn, out, prof: inn - out });
      }
      const tot = rows.reduce((a, r) => ({ inn: a.inn + r.inn, out: a.out + r.out, prof: a.prof + r.prof }), { inn: 0, out: 0, prof: 0 });
      const n = rows.length;
      const cell = (v) => `<td class="${v < 0 ? 'neg' : ''}">${fmt(v, cur)}</td>`;
      const pcell = (v) => `<td class="${v < 0 ? 'neg' : 'pos'}">${fmt(v, cur)}</td>`;
      $('#mbody').innerHTML = `
        <div class="hero"><div class="money3">
          ${stat(fmt(tot.inn / n, cur), t('Antre / mwa', 'Entrées / mois'))}${stat(fmt(tot.out / n, cur), t('Kat / mwa', 'Cartes / mois'))}${stat(fmt(tot.prof / n, cur), t('Benefis / mwa', 'Bénéfice / mois'), tot.prof >= 0 ? 'profit' : 'loss')}
        </div></div>
        <h2>${fmtMonth(first)} → ${fmtMonth(M.end)}</h2>
        <div class="tablewrap"><table class="avg">
          <thead><tr><th>${t('Mwa', 'Mois')}</th><th>${t('Antre', 'Entrées')}</th><th>${t('Kat', 'Cartes')}</th><th>${t('Benefis', 'Bénéfice')}</th></tr></thead>
          <tbody>${rows.map((r) => `<tr><td>${fmtMonth(r.ym)}</td>${cell(r.inn)}${cell(r.out)}${pcell(r.prof)}</tr>`).join('')}</tbody>
          <tfoot><tr><td>${t('Mwayèn', 'Moyenne')}</td>${cell(tot.inn / n)}${cell(tot.out / n)}${pcell(tot.prof / n)}</tr>
          <tr><td>Total</td>${cell(tot.inn)}${cell(tot.out)}${pcell(tot.prof)}</tr></tfoot>
        </table></div>`;
    }
  } catch (err) { box.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

async function refresh(quiet = false) {
  try {
    try { await api.processBilling(); } catch { /* */ }
    const d = await api.loadAll(isOwner());
    S.settings = d.settings || S.settings;
    S.users = d.users || [];
    S.accounts = d.accounts.map((a) => ({ ...a, id: num(a.id), main_slots: num(a.main_slots), plan_price_usd: num(a.plan_price_usd), extra_price_usd: num(a.extra_price_usd), active: !!a.active }));

    S.clients = d.clients.map((c) => ({ ...c, id: num(c.id), account_id: num(c.account_id), extra_id: num(c.extra_id), price: num(c.price) }));
    S.passwords = d.passwords.map((p) => ({ ...p, id: num(p.id), account_id: num(p.account_id) }));
    S.ledger = d.ledger.map((l) => ({ ...l, id: num(l.id), account_id: num(l.account_id), extra_id: num(l.extra_id), amount_usd: num(l.amount_usd), paid_amount: num(l.paid_amount), paid_rate: num(l.paid_rate) }));

function openForm(html, onSubmit, onReady) {
  dlg.innerHTML = `<form class="f" novalidate>${html}<div class="err" id="ferr"></div></form>`;
  const form = $('form', dlg);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', form);
    $('#ferr').textContent = '';
    if (btn) btn.disabled = true;
    try { const keep = await onSubmit(new FormData(form), form); if (!keep) dlg.close(); }
    catch (err) { $('#ferr').textContent = err.message; }
    finally { if (btn) btn.disabled = false; }
  });
  form.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { e.preventDefault(); dlg.close(); } });
  if (!dlg.open) dlg.showModal();
  if (onReady) onReady(form);
  return form;
}
const val = (fd, k) => String(fd.get(k) ?? '').trim();
const numOrNull = (s) => (s === '' ? null : Number(s));
const delBtn = () => `<button type="button" class="btn danger" data-delete>${t('Efase', 'Supprimer')}</button>`;
const formBtns = (left = '', ok = t('Anrejistre', 'Enregistrer')) => `<div class="fbtns">${left}<span class="spacer"></span><button type="button" class="btn" data-close>${t('Anile', 'Annuler')}</button><button type="submit" class="btn primary">${ok}</button></div>`;
function onDelete(form, question, fn) {
  const b = $('[data-delete]', form);
  if (b) b.addEventListener('click', async () => {
    if (!confirm(question)) return;
    try { await fn(); dlg.close(); await refresh(); } catch (err) { $('#ferr').textContent = err.message; }
  });
}

    <div class="grid2"><label>${t('Non', 'Nom')}<input name="label" value="${esc(x.label)}"></label><label>${t('Pri ($/mwa)', 'Prix ($/mois)')}<input name="price_usd" type="number" min="0" step="0.01" value="${esc(x.price_usd)}"></label></div>
    <label>${t('Imèl manm nan', 'E-mail du membre')}<input name="email" type="email" value="${esc(x.email || '')}"></label>
    <label>${t('Kijan li peye', 'Mode de paiement')}<select name="billing"><option value="shared" ${x.billing === 'shared' ? 'selected' : ''}>${t('Sou kat kont lan', 'Carte du compte')}</option><option value="own" ${x.billing === 'own' ? 'selected' : ''}>${t('Pwòp kat pa l', 'Sa propre carte')}</option></select></label>
    <label id="f-nb">${t('Pwochen retrè', 'Prochain prélèvement')}<input name="next_billing" type="date" value="${esc(x.next_billing || a.next_billing)}"></label>
    ${formBtns()}`,
  async (fd) => {
    const obj = { account_id: a.id, label: val(fd, 'label'), email: val(fd, 'email') || null, price_usd: r2(val(fd, 'price_usd')), billing: val(fd, 'billing'), next_billing: val(fd, 'billing') === 'own' ? (val(fd, 'next_billing') || null) : null, active: true };
    if (!isNew) obj.id = x.id;
    await api.saveExtra(obj);
    await refresh();
  },
  (form) => { const s = () => { $('#f-nb', form).hidden = form.billing.value !== 'own'; }; form.billing.addEventListener('change', s); s(); });
}
function walletFrom(el) { const a = acc(Number(el.dataset.id)); const x = el.dataset.x ? ext(Number(el.dataset.x)) : null; return wallet(a, x); }
function coverText(w, add) {
  if (!(w.cost > 0)) return '';
  const months = Math.floor((add + 1e-9) / w.cost), rest = r2(add - months * w.cost);
  const part = rest > 0 ? t(`${months} mwa + ${fmt(rest, 'USD')} rès`, `${months} mois + ${fmt(rest, 'USD')} de reste`) : t(`${months} mwa egzak`, `${months} mois exactement`);
  const nb = r2(w.balance + add);
  return `${t('Kat sa a', 'Cette carte')} = <b>${part}</b>. ${t('Nouvo balans', 'Nouveau solde')}: <b>${fmt(nb, 'USD')}</b> → ${t('kouvri jiska', 'couvert jusqu’au')} <b>${fmtDate(addMonths(w.next, Math.floor((nb + 1e-9) / w.cost)))}</b>.`;
}
function cardForm(w) {
  openForm(`
    <h3>${t('Ajoute kat kado', 'Ajouter une carte cadeau')}</h3>
    <p class="sub">${esc(w.label)} · ${fmt(w.cost, 'USD')}/${t('mwa', 'mois')} · ${t('balans', 'solde')} ${fmt(w.balance, 'USD')}</p>
    <div class="grid2"><label>${t('Montan kat la ($)', 'Montant ($)')}<input name="usd" type="number" min="0" step="0.01" value="${w.cost > 0 ? r2(w.cost * 2) : ''}"></label><label>${t('Dat', 'Date')}<input name="date" type="date" value="${todayStr()}"></label></div>
    <label>${t('Sa w te peye pou li', 'Prix payé')}<div class="money-in"><input name="paid" type="number" min="0" step="any" placeholder="3600"><select name="paid_currency">${curOpts('HTG')}</select></div></label>
    <div class="note" id="f-cover"></div>
    ${formBtns('', t('Ajoute kat la', 'Ajouter'))}`,
  async (fd) => {
    const usd = r2(val(fd, 'usd'));
    if (!(usd > 0)) throw new Error(t('Mete montan kat la.', 'Indiquez le montant.'));
    await api.addCard(w.a.id, w.x ? w.x.id : null, usd, Number(val(fd, 'paid')) || 0, val(fd, 'paid_currency'), val(fd, 'date') || todayStr());
    await refresh();
  },
  (form) => { const s = () => { $('#f-cover', form).innerHTML = coverText(w, Number(form.usd.value) || 0); }; form.usd.addEventListener('input', s); s(); });
}
function calcForm(w) {
  openForm(`
    <h3>${t('Konbyen pou m achte?', 'Combien acheter ?')}</h3>
    <p class="sub">${esc(w.label)} · ${fmt(w.cost, 'USD')}/${t('mwa', 'mois')}</p>
    <label>${t('Pou konbyen mwa', 'Pour combien de mois')}<select name="m">${[1, 2, 3, 4, 5, 6, 12].map((n) => `<option ${n === 2 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <div class="note" id="f-calc"></div>
    <div class="fbtns"><span class="spacer"></span><button type="button" class="btn" data-close>${t('Fèmen', 'Fermer')}</button></div>`,
  async () => {},
  (form) => {
    const s = () => {
      const m = Number(form.m.value), full = r2(w.cost * m), rest = r2(Math.max(0, w.balance) % (w.cost || 1));
      $('#f-calc', form).innerHTML = `${fmt(w.cost, 'USD')} × ${m} = <b>${fmt(full, 'USD')}</b>` + (rest > 0.004 ? `<br>${t(`Ak ${fmt(rest, 'USD')} ki deja sou balans lan: ${fmt(r2(full - rest), 'USD')}`, `Avec ${fmt(rest, 'USD')} déjà sur le solde : ${fmt(r2(full - rest), 'USD')}`)}` : '');
    };
    form.m.addEventListener('change', s); s();
  });
}
function adjustForm(w) {
  openForm(`
    <h3>${t('Korije balans', 'Corriger le solde')}</h3>
    <p class="sub">${esc(w.label)} · ${t('app la di', 'l’app indique')} ${fmt(w.balance, 'USD')}</p>
    <label>${t('Balans Netflix montre a ($)', 'Solde affiché par Netflix ($)')}<input name="bal" type="number" min="0" step="0.01" value="${w.balance}"></label>
    ${formBtns('', t('Korije', 'Corriger'))}`,
  async (fd) => { await api.adjustBalance(w.a.id, w.x ? w.x.id : null, r2(val(fd, 'bal'))); await refresh(); });
}
function genPwForm(a) {
  openForm(`
    <h3>${t('Nouvo modpas', 'Nouveau mot de passe')}</h3>
    <p class="sub">${esc(a.label)}</p>
    <label>${t('Modpas', 'Mot de passe')}<div class="pw-row"><input name="pw" value="${generatePassword()}" autocomplete="off" spellcheck="false" style="font-family:ui-monospace,Menlo,Consolas,monospace"><button type="button" class="btn icon" data-regen>${ICON.refresh}</button></div></label>
    <div class="note">${t('Li rete an atant jiskaske w konfime ou chanje l sou Netflix.', 'Il reste en attente jusqu’à confirmation du changement sur Netflix.')}</div>
    ${formBtns('', t('Kenbe l an atant', 'Mettre en attente'))}`,
  async (fd) => { if (val(fd, 'pw').length < 8) throw new Error(t('Omwen 8 karaktè.', 'Au moins 8 caractères.')); await api.proposePassword(a.id, val(fd, 'pw')); await refresh(); },
  (form) => $('[data-regen]', form).addEventListener('click', () => { form.pw.value = generatePassword(); }));
}
function rateForm() {
  openForm(`
    <h3>${t('To dola', 'Taux du dollar')}</h3>
    <label>1 USD = ? HTG<input name="rate" type="number" min="0" step="0.01" value="${rate()}"></label>
    <div class="note">${t('Peman ak kat ki deja anrejistre yo kenbe to jou yo te fèt la.', 'Les paiements et cartes déjà enregistrés gardent le taux de leur date.')}</div>
    ${formBtns()}`,
  async (fd) => { const r = Number(val(fd, 'rate')); if (!(r > 0)) throw new Error('?'); await api.setRate(r); await refresh(); });
}

// =====================================================================
//  Evènman
// =====================================================================
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || (dlg.open && dlg.contains(el))) return;
  const id = Number(el.dataset.id);
  try {
    switch (el.dataset.action) {
      case 'tab': S.view = null; S.tab = el.dataset.tab; if (S.tab === 'accounts') S.accountId = null; render(); window.scrollTo(0, 0); break;
      case 'filter': S.filter = el.dataset.f; render(); break;
      case 'refresh': await refresh(); toast(t('Done yo ajou.', 'Données à jour.')); break;
      case 'open-settings': S.view = 'settings'; render(); window.scrollTo(0, 0); break;
      case 'close-view': S.view = null; render(); break;
      case 'open-team': S.view = 'team'; render(); break;
      case 'back-settings': S.view = 'settings'; render(); break;
      case 'lang': LANG = el.dataset.v; store.set('gf-lang', LANG); document.documentElement.lang = LANG; renderShell(); render(); break;
      case 'theme': THEME = el.dataset.v; store.set('gf-theme', THEME); applyTheme(); render(); break;
      case 'member': await api.setMemberRole(el.dataset.id, el.dataset.v); await refresh(); break;
      case 'logout':
        if (!confirm(DEMO ? t('Efase done demo yo?', 'Réinitialiser la démo ?') : t('Dekonekte?', 'Se déconnecter ?'))) return;
        await api.signOut(); location.reload(); break;
      case 'add': if (S.tab === 'accounts') accountForm(); else clientForm(null); break;
      case 'client': clientSheet(cli(id)); break;
      case 'pay': payForm(cli(id)); break;
      case 'remind': { const c = cli(id); sendSheet(t('Voye rapèl', 'Envoyer un rappel'), esc(c.name), c, reminderMsg(c)); break; }
      case 'send-pw': passwordSheet(cli(id)); break;
      case 'open-account': S.view = null; S.tab = 'accounts'; S.accountId = id; render(); window.scrollTo(0, 0); break;
      case 'back': S.accountId = null; render(); break;
      case 'edit-account': accountForm(acc(id)); break;
      case 'add-extra': extraForm(acc(id)); break;
      case 'edit-extra': { const x = ext(id); extraForm(acc(x.account_id), x); break; }
      case 'retire-extra': if (!confirm(t('Retire plas sa a?', 'Retirer cette place ?'))) return; await api.saveExtra({ id, active: false }); await refresh(); break;
      case 'add-card': cardForm(walletFrom(el)); break;
      case 'calc': calcForm(walletFrom(el)); break;
      case 'adjust': adjustForm(walletFrom(el)); break;
      case 'gen-pw': genPwForm(acc(id)); break;
      case 'confirm-pw': if (!confirm(t('Ou chanje modpas la sou Netflix?', 'Avez-vous changé le mot de passe sur Netflix ?'))) return; await api.confirmPassword(id); await refresh(); break;
      case 'cancel-pw': await api.cancelPassword(id); await refresh(); break;
      case 'show-pw': { const s = $('.pw', el.closest('.pw-row')); s.textContent = s.textContent.startsWith('•') ? s.dataset.pw : '••••-••••-••••'; break; }
      case 'copy': await copyText(el.dataset.text); break;
      case 'set-rate': rateForm(); break;
      case 'money-mode': S.money.mode = el.dataset.v; render(); break;
      case 'money-cur': S.money.cur = el.dataset.v; render(); break;
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'search') { S.q = e.target.value; $('#clist').innerHTML = clientsList(); } });
document.addEventListener('change', async (e) => {
  const id = e.target.id;
  if (id === 'm-month' && e.target.value) { S.money.month = e.target.value; loadMoney(); }
  if (id === 'm-end' && e.target.value) { S.money.end = e.target.value; loadMoney(); }
  if (id === 'm-count') { S.money.count = Number(e.target.value); loadMoney(); }
  if (id === 'demo-as') { api.viewAs(e.target.value); S.me = await api.me(); renderShell(); await refresh(); }
  if (e.target.dataset.role) {
    try { await api.setMemberRole(e.target.dataset.role, e.target.value); } catch (err) { toast(err.message); }
    await refresh();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && !dlg.open) refresh(true); });

// =====================================================================
//  Koneksyon / Enskripsyon
// =====================================================================
function showLogin(msg = '', mode = 'in') {
  app.innerHTML = `
    <div class="login">
      <div class="brand"><h1>${esc(C.BUSINESS_NAME)}</h1><p>${t('Jesyon kliyan ak kont', 'Gestion des clients et des comptes')}</p></div>
      <div class="card">
        <div class="seg"><button data-mode="in" class="${mode === 'in' ? 'on' : ''}">${t('Konekte', 'Connexion')}</button><button data-mode="up" class="${mode === 'up' ? 'on' : ''}">${t('Enskri', 'Inscription')}</button></div>
        <form class="f" id="loginf">
          ${mode === 'up' ? `<label>${t('Non ou', 'Votre nom')}<input name="name" required autocomplete="name"></label>` : ''}
          <label>${t('Imèl', 'E-mail')}<input name="email" type="email" required autocomplete="username"></label>
          <label>${t('Modpas', 'Mot de passe')}<input name="password" type="password" required autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}"></label>
          ${mode === 'up' ? `<div class="note">${t('Apre w enskri, pwopriyetè prensipal la dwe ba w yon wòl anvan ou ka wè anyen.', 'Après l’inscription, le propriétaire principal doit vous attribuer un rôle.')}</div>` : ''}
          <div class="err" id="lerr">${esc(msg)}</div>
          <button type="submit" class="btn primary block">${mode === 'up' ? t('Enskri', 'S’inscrire') : t('Konekte', 'Se connecter')}</button>
        </form>
      </div>
      <div class="seg" style="margin:16px 40px 0"><button class="${LANG === 'ht' ? 'on' : ''}" data-lg="ht">Kreyòl</button><button class="${LANG === 'fr' ? 'on' : ''}" data-lg="fr">Français</button></div>
    </div>`;
  app.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => showLogin('', b.dataset.mode)));
  app.querySelectorAll('[data-lg]').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.lg; store.set('gf-lang', LANG); showLogin('', mode); }));
  $('#loginf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = $('button[type=submit]', e.target);
    btn.disabled = true; $('#lerr').textContent = '';
    try {
      if (mode === 'up') {
        const hasSession = await api.signUp(val(fd, 'name'), val(fd, 'email'), String(fd.get('password')));
        if (hasSession) return start();
        return showLogin(t('Kont ou kreye. Gade imèl ou pou konfime l, epi konekte.', 'Compte créé. Confirmez votre e-mail puis connectez-vous.'), 'in');
      }
      await api.signIn(val(fd, 'email'), String(fd.get('password'))); await start();
    } catch (err) { $('#lerr').textContent = err.message; btn.disabled = false; }
  });
}
function showWaiting() {
  app.innerHTML = `<div class="login"><div class="brand"><h1>${esc(C.BUSINESS_NAME)}</h1></div>
    <div class="panel" style="text-align:center"><b>${t('Demann ou an voye ✓', 'Demande envoyée ✓')}</b><div class="sub">${t('Pwopriyetè prensipal la dwe aksepte w. Retounen pita.', 'Le propriétaire principal doit vous accepter. Revenez plus tard.')}</div>
    <button class="btn" data-action="logout">${t('Dekonekte', 'Se déconnecter')}</button></div></div>`;
}
async function start() {
  const s = await api.session();
  if (!s) return showLogin();
  S.me = await api.me();
  if (S.me && S.me.role === 'none') { await api.requestAccess(); S.me = await api.me(); }
  if (!S.me || !['owner', 'associate'].includes(S.me.role)) return showWaiting();
  renderShell();
  await refresh();
}

(async () => {
  try {
    if (DEMO) api = demoApi();
    else {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      api = supabaseApi(createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY));
    }
    if (DEMO && new URLSearchParams(location.search).has('login')) showLogin('', new URLSearchParams(location.search).get('login') === 'up' ? 'up' : 'in');
    else await start();
  } catch (err) {
    app.innerHTML = `<div class="login"><div class="empty">${esc(err.message)}</div></div>`;
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
